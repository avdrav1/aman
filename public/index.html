<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aman Core Loop Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: the map is home. A goal strip says how close you are to winning; one side panel shows either this season's to-do list or a single power. Everything else lives behind tabs. */
:root {
  --bg: #eef0f6;
  --surface: #ffffff;
  --sunk: #f5f6fa;
  --ink: #1b1f3a;
  --muted: #5b6182;
  --line: #d6d9e8;
  --accent: #e7a01c;      /* marigold: the federation */
  --accent-ink: #3b2600;
  --river: #2779a3;
  --good: #23794a;
  --warn: #a35f00;
  --bad: #b93535;
  --company: #8c2b4c;     /* the Company */
  --cloud: #ffffff; --cloud-edge: #b9c6dc; --cloud-heavy: #8d9ab6; --fog: #fbfcff; --sand: #a8742c; --relief: #6b6f8c;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
  /* Each power's color (--hue-<id>) is generated by powerColors() in the script from the engine's hue
     suggestions: hues spread evenly in table order of hue, three lightness steps so neighbors differ,
     all at least 3:1 against --bg. These set the oklch lightness of the three steps, and the chroma. */
  --p-l0: .44; --p-l1: .52; --p-l2: .6; --p-c: .14;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111326; --surface: #1a1d36; --sunk: #151830; --ink: #e8e9f5; --muted: #9da3c6; --line: #2f3359;
    --accent: #f0b03a; --accent-ink: #2b1c00; --river: #62b6dc; --good: #62c690; --warn: #e6a550; --bad: #f08080; --company: #e57ba1;
    --cloud: #c9cfe8; --cloud-edge: #8d95bd; --cloud-heavy: #6c769e; --fog: #c3c9e4; --sand: #d6a35a; --relief: #8a90b6;
    --p-l0: .62; --p-l1: .72; --p-l2: .82; --p-c: .12;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111326; --surface: #1a1d36; --sunk: #151830; --ink: #e8e9f5; --muted: #9da3c6; --line: #2f3359;
  --accent: #f0b03a; --accent-ink: #2b1c00; --river: #62b6dc; --good: #62c690; --warn: #e6a550; --bad: #f08080; --company: #e57ba1;
  --cloud: #c9cfe8; --cloud-edge: #8d95bd; --cloud-heavy: #6c769e; --fog: #c3c9e4; --sand: #d6a35a; --relief: #8a90b6;
  --p-l0: .62; --p-l1: .72; --p-l2: .82; --p-c: .12;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h2 { font-size: 17px; font-weight: 700; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-family: var(--font-body); font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 2px solid var(--river); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.ic { width: 14px; height: 14px; vertical-align: -2px; flex: none; }
.ic-water { color: var(--river); } .ic-energy { color: var(--warn); } .ic-food { color: var(--good); } .ic-capital { color: var(--muted); } .ic-inf { color: var(--accent); }

/* top bar */
.top { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand h1 { font-size: 24px; font-weight: 700; line-height: 1; }
.brand .ghost { font-size: 12.5px; padding: 4px 9px; }
.when { display: flex; flex-direction: column; gap: 4px; flex: 1 1 260px; max-width: 430px; min-width: 0; }
.when b { font-family: var(--font-display); font-size: 15px; }
.when b span { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 4px; }
/* the three-act track: one bar per season, grouped by act */
.track { display: flex; gap: 7px; align-items: flex-end; width: 100%; }
.track .ag { flex: var(--n) 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.track .ag > span { font-size: 10px; line-height: 1.1; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track .ag.cur > span { color: var(--ink); font-weight: 600; }
.track .ag.next { opacity: .55; }
.track .bars { display: flex; gap: 2px; align-items: flex-end; height: 18px; padding-top: 6px; }
.track i { display: block; flex: 1 1 0; min-width: 2px; max-width: 13px; height: 5px; border-radius: 2px; background: var(--line); position: relative; }
.track i.mon { height: 10px; background: color-mix(in srgb, var(--river) 45%, var(--line)); }
.track i.done { background: var(--muted); }
.track i.now { background: var(--accent); }
.track i.cn::after { content: ""; position: absolute; left: 50%; top: -6px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--river); }
.track i.call::before { content: ""; position: absolute; left: -2px; bottom: 0; width: 2px; height: 16px; border-radius: 1px; background: var(--accent); }
.track i.vote { box-shadow: 0 0 0 1.5px var(--accent); }
.res { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.chip { background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; display: flex; align-items: center; gap: 6px; }
.chip b { font-size: 16px; font-family: var(--font-display); }
.chip em { font-style: normal; font-size: 11px; color: var(--muted); }
.chip.low b { color: var(--bad); }
.chip.inf { border-color: var(--accent); }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 700; font-family: var(--font-display); font-size: 15px; }
.primary:hover { filter: brightness(1.06); }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; color: var(--muted); }
.ghost:hover { color: var(--ink); border-color: var(--muted); }

/* goal strip: the count toward the act's goal, then a compact grid with a chip per power */
.goal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
.goal .big { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; flex: 1 1 auto; }
.goal .big b { white-space: nowrap; font-family: var(--font-display); font-size: 28px; line-height: 1; }
.goal .big span { color: var(--muted); line-height: 1.25; font-size: 12.5px; max-width: 46ch; }
.goal > .ghost { margin-left: auto; }
.pcs { flex: 1 1 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 4px; min-width: 0; }
.pc { background: var(--sunk); border: 1px solid var(--line); border-radius: 7px; padding: 3px 7px 4px; display: flex; flex-direction: column; gap: 1px; text-align: left; min-width: 0; }
.pc:hover, .pc.sel, .pc.hot { border-color: var(--river); box-shadow: 0 0 0 1px var(--river); }
.pc .nm { display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; line-height: 1.3; min-width: 0; }
.pc .nm > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.swt { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
.pc .r2 { display: flex; align-items: center; gap: 6px; min-height: 15px; }
.pc.member { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pc.member .swt { box-shadow: 0 0 0 1.5px var(--surface); }
.pc.client { border-color: var(--company); border-style: dashed; }
@media (max-width: 480px) { .goal { padding: 8px 10px; } .pcs { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; } .pc { padding: 2px 5px 3px; } .pc .nm { font-size: 11px; gap: 4px; } .pc .spk svg { width: 26px; } .pc .r2 { gap: 4px; } .goal .big b { font-size: 24px; } }
.dots { display: inline-flex; gap: 2px; align-items: center; font-size: 11px; color: var(--muted); }
.dots i { width: 6.5px; height: 6.5px; border-radius: 50%; border: 1.3px solid var(--muted); display: block; }
.dots i.on { background: var(--good); border-color: var(--good); }
.pc.member .dots { color: var(--accent-ink); }
.pc.member .dots i:not(.on) { border-color: var(--accent-ink); }

/* views */
.views { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; }
.views button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 4px 10px; font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--muted); }
.views button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }
.views .say { margin-left: auto; font-size: 13px; color: var(--muted); max-width: 60ch; text-align: right; }
.home { display: grid; grid-template-columns: minmax(0, 7fr) minmax(320px, 5fr); gap: 12px; align-items: start; }
@media (max-width: 860px) { .home { grid-template-columns: 1fr; } .res { margin-left: 0; } .views .say { margin-left: 0; text-align: left; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel > header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.panel > header small { color: var(--muted); display: block; }
.sec { display: flex; flex-direction: column; gap: 7px; }

/* map */
.map svg { width: 100%; height: auto; display: block; overflow: hidden; max-height: 780px; border-radius: 8px; --season: #6fae5a; }
.map svg.s-Monsoon { --season: #3f7fb0; } .map svg.s-Autumn { --season: #d59a2b; } .map svg.s-Winter { --season: #9aa7c7; } .map svg.dry { --season: #c98a2b; }
.map .sea { fill: color-mix(in srgb, var(--river) 13%, var(--surface)); }
.map .land { fill: color-mix(in srgb, var(--season) 16%, var(--sunk)); stroke: color-mix(in srgb, var(--season) 30%, var(--line)); stroke-width: 2; stroke-linejoin: round; }
.map .zone { fill: var(--accent); }
.map .grip { fill: url(#stripes); }
.map .river { fill: none; stroke: var(--river); stroke-linecap: round; stroke-linejoin: round; opacity: .75; }
.map .river.minor { opacity: .5; }
.map .bed { fill: none; stroke: var(--sand); stroke-linecap: round; stroke-linejoin: round; opacity: .35; }
.map .flood { fill: none; stroke: var(--river); stroke-linecap: round; stroke-linejoin: round; opacity: .2; }
.map svg.wx-good .shimmer { stroke-width: 1.8; opacity: 1; }
.map svg.dry .shimmer { opacity: .35; }
/* relief: marks only, never outlines */
.map .terrain path { fill: none; stroke: var(--relief); stroke-linecap: round; stroke-linejoin: round; }
.map .t-mtn { stroke-width: 1.1; opacity: .55; }
.map .t-desert { stroke: var(--sand); stroke-width: 1.6; opacity: .55; }
.map .t-plateau { stroke-width: 1; opacity: .3; }
.map .parch { opacity: .6; }
#cracks path { fill: none; stroke: var(--sand); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
/* weather */
.map .cloud { fill: var(--cloud); stroke: var(--cloud-edge); stroke-width: 1; }
.map .clouds { opacity: .72; }
.map .clouds.failed { opacity: .45; }
.map .clouds.good .cloud { fill: var(--cloud-heavy); stroke: none; }
.map .clouds.good { opacity: .62; }
.map .fog .bank { fill: var(--fog); opacity: .85; }
.map .fog .mist { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 22 6 40 8; opacity: .4; }
:root[data-theme="dark"] .map .fog .bank { opacity: .35; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .map .fog .bank { opacity: .35; } }
.map .heat path { fill: none; stroke: var(--warn); stroke-width: 1.5; stroke-linecap: round; opacity: .6; }
.map .wxbadge .sun { fill: var(--warn); }
.map .wxbadge .ray, .map .wxbadge .crk, .map .wxbadge .mist, .map .wxbadge .drop { fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.map .wxbadge .ray { stroke: var(--warn); }
.map .wxbadge .crk { stroke: var(--sand); }
.map .wxbadge .mist { stroke: var(--muted); stroke-width: 2; }
.map .wxbadge .mist.warm { stroke: var(--warn); stroke-width: 1.3; }
.map .wxbadge .drop { stroke: var(--river); }
.map .wxbadge .cloud.heavy { fill: var(--cloud-heavy); stroke: none; }
.map .shimmer { fill: none; stroke: var(--surface); stroke-width: 1.2; stroke-linecap: round; stroke-dasharray: 3 14; opacity: .8; }
.map text { font-family: var(--font-body); font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: color-mix(in srgb, var(--surface) 75%, transparent); stroke-width: 3px; stroke-linejoin: round; }
.map text.seat { fill: var(--muted); font-size: 9.5px; }
.map text.rl { fill: var(--river); font-size: 9.5px; font-style: italic; }
.map text.cap { font-size: 10.5px; fill: var(--muted); font-weight: 600; }
.map text.nm { font-weight: 600; }
.map text.nm.you { font-weight: 700; }
.map .leader line { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 2; opacity: .8; }
.map .leader circle { fill: var(--muted); }
.map .node, .map text.nm { cursor: pointer; }
.map .node .hit { fill: transparent; }
.map .node .base { fill: var(--surface); stroke: var(--line); stroke-width: 3.2; }
.map .node .ring { fill: none; stroke: var(--muted); stroke-width: 3.2; stroke-linecap: round; }
.map .node.member .base { fill: var(--accent); }
.map .node.member .ring { stroke: var(--accent-ink); }
.map .node.client .ring { stroke: var(--company); }
.map .halo { fill: none; stroke: transparent; stroke-width: 2; }
.map .node.sel .halo, .map .node:hover .halo { stroke: var(--river); }
.map .node text.t { font-size: 11px; font-weight: 600; text-anchor: middle; dominant-baseline: central; stroke: none; }
.map .node.member text.t { fill: var(--accent-ink); }
.map .gd { fill: var(--surface); stroke: var(--muted); stroke-width: 1.2; }
.map .gd.on { fill: var(--good); stroke: var(--good); }
.map .home .base { fill: var(--accent); stroke: var(--accent-ink); stroke-width: 1.5; }
.map .rln { stroke-width: 2; opacity: .8; stroke-linecap: round; }
.map .rln.neg { stroke: var(--bad); stroke-dasharray: 5 5; }
.map .rln.pos { stroke: var(--good); }
.map .rln.strong { stroke-width: 4; }
.map .rail { fill: none; stroke: var(--ink); stroke-width: 1.6; opacity: .75; }
.map .ties { fill: none; stroke: var(--ink); stroke-width: 6; stroke-dasharray: 1.5 6; opacity: .75; }
.map .power { fill: none; stroke: var(--warn); stroke-width: 1.8; stroke-dasharray: 6 3; }
.map .dam { fill: var(--ink); stroke: var(--surface); stroke-width: 1; }
.map .dam.plan { fill: var(--surface); stroke: var(--ink); stroke-dasharray: 2 2; }
.map .seal circle { fill: var(--surface); stroke: var(--river); stroke-width: 1.6; }
.map .seal path { fill: none; stroke: var(--river); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.map .fort { fill: var(--company); stroke: var(--surface); stroke-width: 1; }
.map .fort.plan { fill: var(--surface); stroke: var(--company); stroke-dasharray: 2 2; }
.map .co-base path { fill: var(--company); }
.map .co-base text { fill: var(--company); font-weight: 600; font-size: 10px; }
.map .ask circle { fill: var(--surface); stroke: var(--river); stroke-width: 1.6; }
.map .pbadge rect { fill: var(--accent); }
.map .pbadge text { fill: var(--accent-ink); font-size: 9.5px; font-weight: 700; text-anchor: middle; stroke: none; }
.map .rain { stroke: var(--river); stroke-width: 1.4; stroke-linecap: round; opacity: .55; }
.map .wind { fill: none; stroke: var(--river); stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: 16 12; opacity: .35; }
.map .tok circle { stroke: var(--surface); stroke-width: 1.5; }
.map .tok.you circle { fill: var(--accent); } .map .tok.you use { color: var(--accent-ink); }
.map .tok.co circle { fill: var(--surface); stroke: var(--company); } .map .tok.co use { color: var(--company); }
.map .fl { font-family: var(--font-display); font-size: 13px; font-weight: 700; stroke: var(--surface); stroke-width: 3.5px; }
.map .fl.up { fill: var(--good); } .map .fl.down { fill: var(--bad); }
.map .burst { fill: none; stroke: var(--accent); stroke-width: 3; }
@media (prefers-reduced-motion: no-preference) {
  .map .shimmer { animation: flow 2.2s linear infinite; }
  .map .rain { animation: rain .9s linear infinite; }
  .map .land, .map .zone, .map .river { transition: fill .6s, opacity .6s, stroke-width .6s; }
}
@keyframes flow { to { stroke-dashoffset: -17; } }
@keyframes wind { to { stroke-dashoffset: -28; } }
@keyframes rain { from { transform: translate(6px, -16px); opacity: 0; } 30% { opacity: .6; } to { transform: translate(-6px, 16px); opacity: 0; } }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend svg { width: 16px; height: 12px; flex: none; }

/* playback, suggestions, attention */
.mapwrap { position: relative; }
.caption { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--muted); box-shadow: 0 4px 16px rgba(10, 12, 30, .18); font-weight: 500; }
.caption.good { border-left-color: var(--good); } .caption.bad { border-left-color: var(--bad); } .caption.warn { border-left-color: var(--company); } .caption.ask { border-left-color: var(--river); } .caption.plan { border-left-color: var(--accent); }
.caption .step { color: var(--muted); font-size: 12px; white-space: nowrap; }
.caption .txt { flex: 1; }
.map .spot { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-dasharray: 6 5; }
.map .sugg { cursor: pointer; }
.map .sugg .casing { fill: none; stroke: var(--surface); stroke-width: 6; stroke-linecap: round; opacity: .9; }
.map .sugg .line { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; }
.map .sugg .nb { fill: var(--ink); stroke: var(--surface); stroke-width: 1.5; }
.map .sugg text { fill: var(--surface); font-size: 10px; font-weight: 700; text-anchor: middle; stroke: none; }
.map .sugg:hover .line, .map .sugg:focus .line { stroke: var(--river); stroke-width: 3.4; }
.map .sugg:hover .nb, .map .sugg:focus .nb { fill: var(--river); }
.map .need { fill: none; stroke: var(--muted); stroke-width: 2.2; }
.map .need.t-good { stroke: var(--good); } .map .need.t-bad { stroke: var(--bad); } .map .need.t-co { stroke: var(--company); } .map .need.t-ask { stroke: var(--river); } .map .need.t-plan { stroke: var(--accent); }
.map .rpin circle { fill: var(--good); stroke: var(--surface); stroke-width: 1.5; }
.map .rpin path { fill: none; stroke: var(--surface); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.map .strain rect.hit { fill: transparent; stroke: none; }
.map .pin { transition: opacity .2s; }
.map .pin.t-bad.strain rect:not(.hit) { stroke-width: 1.6; }
/* a chip lights its pins: the rest of the map steps back */
.map svg.hl .pin:not(.lit), .map svg.hl .node:not(.lit) .need, .map svg.hl .home:not(.lit) .need { opacity: .18; }
.map svg.hl .node:not(.lit) .base, .map svg.hl .node:not(.lit) .ring, .map svg.hl .node:not(.lit) text.t { opacity: .45; }
.map .pin.lit { filter: drop-shadow(0 0 3px var(--ink)); }
.map .node.lit .need { stroke-width: 4; }
.map .sugg.lit .line { stroke: var(--river); stroke-width: 3.4; } .map .sugg.lit .nb { fill: var(--river); }
.tip { position: absolute; z-index: 3; max-width: min(280px, calc(100% - 8px)); background: var(--surface); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 4px 16px rgba(10, 12, 30, .2); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.35; }
.tip[hidden] { display: none; }
.tip p { display: flex; gap: 7px; align-items: flex-start; }
.tip p svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
.tip .ghost { align-self: flex-start; font-size: 12.5px; padding: 3px 9px; }
.achips { display: flex; flex-wrap: wrap; gap: 6px; }
.achip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px 4px 6px; border-radius: 20px; border: 1px solid var(--line); background: var(--sunk); }
.achip svg { width: 18px; height: 18px; flex: none; }
.achip b { font-family: var(--font-display); font-size: 15px; line-height: 1; }
.achip span { font-size: 11.5px; color: var(--muted); }
.achip:hover, .achip[aria-pressed="true"] { border-color: var(--ink); }
.achip[aria-pressed="true"] { background: var(--surface); box-shadow: 0 0 0 1px var(--ink); }
.attlist summary { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.sugwhy { font-size: 12.5px; color: var(--muted); min-height: 2.7em; padding: 0 2px; }
@media (hover: none) { .sugwhy { display: none; } }
.sug.lit .act { border-color: var(--river); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.map .agent { color: var(--company); }
.map .agent circle { fill: var(--surface); stroke: var(--company); stroke-width: 1.6; }
.map .agent.blocked { opacity: .55; }
.map .agent.blocked path { stroke: var(--company); stroke-width: 1.6; }
.nbadge { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: var(--surface); font-size: 11px; font-weight: 700; flex: none; }
.sug .act > span:first-child { display: inline-flex; gap: 7px; align-items: center; }
@media (prefers-reduced-motion: no-preference) {
  .map .spot { animation: spin 6s linear infinite; transform-box: fill-box; transform-origin: center; }
  .map .need { animation: pulse 1.6s ease-in-out infinite; }
  .map .drift { animation: drift 50s linear infinite; }
  .map .wind { animation: wind 4s linear infinite; }
  .map .fog .bank, .map .fog .mist { animation: fogdrift 22s ease-in-out infinite alternate; }
  .map .heat path { animation: heat 3.2s ease-in-out infinite; }
  .map svg.wx-good .shimmer { animation-duration: 1.2s; }
  .map .agent:not(.blocked), .map .ask { animation: nudge 1.6s ease-in-out infinite; }
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
/* along the monsoon line, southwest to northeast: the map sets --wdx and --wdy from WXDIR in the script */
@keyframes drift { 0% { transform: translate(calc(-1 * var(--wdx)), calc(-1 * var(--wdy))); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translate(var(--wdx), var(--wdy)); opacity: 0; } }
@keyframes fogdrift { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
@keyframes heat { 0% { transform: translateY(2px); opacity: 0; } 40% { opacity: .8; } 100% { transform: translateY(-7px); opacity: 0; } }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }

/* dossier */
.dossier-head { display: flex; gap: 12px; align-items: center; }
.dossier-head .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.dossier-head .who small { color: var(--muted); }
.portrait { width: 76px; height: 76px; flex: none; }
.moodrow { display: flex; gap: 12px; align-items: center; }
.speech { flex: 1; position: relative; background: var(--sunk); border-radius: 10px; padding: 9px 12px; font-size: 14px; font-style: italic; }
.speech::before { content: ""; position: absolute; left: 22px; top: -7px; border: 7px solid transparent; border-top: 0; border-bottom-color: var(--sunk); }
.speech b { display: block; font-style: normal; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 2px; }
.dial { width: 136px; flex: none; }
.dial text { font-family: var(--font-display); fill: var(--ink); }
.gtiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 6px; }
.gt { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3px; padding: 8px 4px; border-radius: 9px; border: 1.5px solid var(--bad); background: var(--surface); }
.gt.ok { border-color: var(--good); background: color-mix(in srgb, var(--good) 9%, var(--surface)); }
.gt .gi { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bad); color: var(--bad); }
.gt.ok .gi { background: var(--good); border-color: var(--good); color: var(--surface); }
.gt .gi svg { width: 17px; height: 17px; }
.gt b { font-size: 12px; font-weight: 600; line-height: 1.2; }
.gt small { font-size: 11.5px; color: var(--muted); line-height: 1.2; }
.gt:not(.ok) small { color: var(--bad); font-weight: 600; }
.gauges { display: flex; gap: 10px; flex-wrap: wrap; }
.gauge { flex: 1; min-width: 150px; display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 9px; background: var(--sunk); }
.gauge > svg { width: 30px; height: 52px; flex: none; }
.gauge b { display: block; font-size: 13px; }
.gauge small { color: var(--muted); font-size: 11.5px; display: block; }
.star { width: 100%; max-width: 330px; height: auto; display: block; }
.star text { font-family: var(--font-body); font-size: 12.5px; font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.star text.r { font-size: 11px; }
.planbox { display: flex; gap: 10px; align-items: center; }
.planbox .cd { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center; flex: none; }
.planbox div { display: flex; flex-direction: column; gap: 2px; }
.act .nbadge { margin-right: 6px; }

/* to-do, adviser */
.todo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.todo li { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 7px 10px; border-radius: 8px; background: var(--sunk); border-left: 3px solid var(--muted); }
.todo li.co { border-color: var(--company); } .todo li.ask { border-color: var(--river); } .todo li.good { border-color: var(--good); } .todo li.plan { border-color: var(--accent); }
.todo li.done { opacity: .6; }
.news { display: flex; flex-direction: column; gap: 5px; }
.news > div { padding-left: 14px; position: relative; }
.news > div::before { content: ""; position: absolute; left: 0; top: .5em; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.news > div.good::before { background: var(--good); } .news > div.bad::before { background: var(--bad); } .news > div.warn::before { background: var(--company); } .news > div.plan::before { background: var(--accent); }
.newsys { border: 1px solid var(--accent); border-radius: 8px; padding: 9px 12px; background: color-mix(in srgb, var(--accent) 10%, var(--surface)); max-width: 65ch; }
.adv { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.adv header { display: flex; justify-content: space-between; align-items: center; }
.sw { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.sw input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.sug { display: flex; flex-direction: column; gap: 3px; }
.sug small { color: var(--muted); padding-left: 2px; }

/* actions */
.acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
.act { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 2px 8px; }
.act > span:first-child { font-weight: 600; font-size: 13px; }
.act small { flex-basis: 100%; color: var(--muted); font-size: 11.5px; }
.cost { display: inline-flex; gap: 7px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.cost span { display: inline-flex; align-items: center; gap: 2px; }
.act:not([aria-disabled="true"]):hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.act[aria-disabled="true"] { cursor: not-allowed; background: transparent; }
.act[aria-disabled="true"] > span:first-child, .act[aria-disabled="true"] .cost { opacity: .5; }
.act.key:not([aria-disabled="true"]) { border-color: var(--good); }
.detail { height: 78px; overflow-y: auto; font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--sunk); color: var(--muted); }
.detail b { color: var(--ink); }
.detail .no { color: var(--bad); }

/* power panel */
.tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.member { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tag.co { border-color: var(--company); color: var(--company); }
.gates { display: grid; grid-template-columns: auto 1fr auto; gap: 5px 10px; align-items: center; }
.mark { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; background: var(--good); }
.mark.no { background: transparent; border: 1.5px solid var(--bad); color: var(--bad); }
.gates .v { color: var(--muted); text-align: right; }
.gates .v.no { color: var(--bad); font-weight: 600; }
.bar { display: block; height: 6px; background: var(--line); border-radius: 3px; position: relative; grid-column: 2 / 4; margin-top: -2px; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--muted); }
.bar > u { position: absolute; left: 55%; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .6; }
.needs { display: grid; grid-template-columns: auto auto 1fr; gap: 4px 10px; align-items: baseline; font-size: 13px; }
.needs small { color: var(--muted); }
.pips { display: inline-flex; gap: 3px; vertical-align: middle; }
.pips i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); display: block; }
.pips i.on { background: var(--accent); border-color: var(--accent); }
.rels .neg { color: var(--bad); font-weight: 600; } .rels .pos { color: var(--good); font-weight: 600; }
.planbox { border-left: 3px solid var(--accent); background: var(--sunk); border-radius: 0 8px 8px 0; padding: 8px 10px; font-size: 13px; }
.planbox span { color: var(--muted); }
.up { color: var(--good); } .down { color: var(--bad); }

/* other views */
.rows { display: flex; flex-direction: column; gap: 6px; }
.row { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 12px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--sunk); }
.row small { grid-column: 1 / -1; color: var(--muted); }
.relchip { font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 20px; border: 1px solid var(--line); color: var(--muted); }
.relchip.neg { border-color: var(--bad); color: var(--bad); } .relchip.pos { border-color: var(--good); color: var(--good); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 9px; padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--sunk); }
.card b { font-family: var(--font-display); font-size: 15px; }
.card .catch { color: var(--warn); }
.card .why { color: var(--muted); font-size: 12.5px; }
.card .act { margin-top: auto; }
.charter div { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.charter div span { color: var(--muted); }
ul.lines { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-width: 80ch; }
ul.lines li { padding-left: 14px; position: relative; }
ul.lines li::before { content: ""; position: absolute; left: 0; top: .5em; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
ul.lines li.good::before { background: var(--good); } ul.lines li.bad::before { background: var(--bad); } ul.lines li.warn::before { background: var(--company); }
ul.lines li small { color: var(--muted); margin-right: 6px; }
details summary { cursor: pointer; font-weight: 600; }
details > *:not(summary) { margin-top: 8px; }
.note { color: var(--muted); font-size: 12.5px; max-width: 70ch; }

/* overlay */
.veil { position: fixed; inset: 0; background: rgba(10, 12, 30, .6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.dlg { background: var(--surface); border-radius: 12px; max-width: 620px; width: 100%; max-height: 100%; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; border-top: 5px solid var(--accent); }
.dlg.co { border-top-color: var(--company); }
.dlg h2 { font-size: 22px; }
.dlg p { max-width: 62ch; }
.helprow { display: flex; gap: 12px; align-items: center; }
.helprow .gi { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--good); color: var(--surface); flex: none; }
.helprow .gi svg { width: 17px; height: 17px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.opts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { text-align: left; background: var(--sunk); border: 1px solid var(--line); border-radius: 9px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.opt:not(:disabled):hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.opt:disabled { opacity: .5; cursor: not-allowed; }
.opt b { font-family: var(--font-display); font-size: 16px; }
.opt small { color: var(--muted); }
.opt ul { margin: 0; padding: 0; list-style: none; font-size: 12.5px; display: flex; flex-direction: column; gap: 2px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
@media (max-width: 480px) { .opts.two { grid-template-columns: 1fr; } }

/* acts 2 and 3: demands, strain, motions, pledges, holdouts */
.map .dem rect { fill: var(--surface); stroke: var(--ink); stroke-width: 1.8; }
.map .strain rect { fill: var(--surface); stroke: var(--bad); stroke-width: 1.2; }
.map .strain rect.on { fill: var(--bad); }
.map .mbadge rect { fill: var(--surface); stroke: var(--accent); stroke-width: 1.8; }
.map .mbadge path { fill: none; stroke: var(--accent); stroke-width: 1.4; }
.map .mbadge text { fill: var(--ink); font-size: 9.5px; font-weight: 700; text-anchor: middle; stroke: none; }
.map .pseal circle { fill: var(--good); stroke: var(--surface); stroke-width: 1.5; }
.map .pseal path { fill: none; stroke: var(--surface); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.map .left { fill: none; stroke: var(--bad); stroke-width: 1.8; stroke-dasharray: 4 3; }
.map text.ntag { font-size: 9.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; fill: var(--bad); }
.map text.ntag.hold { fill: var(--warn); }
.map .rln.hard { stroke-width: 3.2; opacity: .95; }
.map .rln.hard.strong { stroke-width: 5; }
.map .co-base .ship2 { opacity: .8; }
@media (prefers-reduced-motion: no-preference) {
  .map .dem { animation: nudge 1.6s ease-in-out infinite; }
  .map .rln.pulse { animation: thump .9s ease-in-out 2; }
}
@keyframes thump { 50% { stroke-width: 8; opacity: 1; } }
.marks { display: inline-flex; gap: 2px; vertical-align: middle; }
.marks i { width: 9px; height: 4px; border-radius: 1px; border: 1.2px solid var(--bad); display: block; }
.marks i.on { background: var(--bad); }
.pc.member .marks i { border-color: var(--accent-ink); }
.pc.member .marks i.on { background: var(--bad); border-color: var(--bad); }
.pc .sealmini { width: 12px; height: 12px; }
/* a power that walked out, or a holdout in Act 3: a thick colored edge, named in the tooltip */
.pc.out { border-left: 4px solid var(--bad); }
.pc.hold { border-left: 4px solid var(--warn); }
.seals { flex: none; }
.seals .s { fill: var(--good); stroke: var(--good); stroke-width: 1.5; }
.seals .e { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 3 2.4; }
.seals path { fill: none; stroke: var(--surface); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.seals .sep { stroke: var(--muted); stroke-width: 1.5; }
.seals text { font-family: var(--font-body); font-size: 9.5px; fill: var(--muted); }
.grv { border-left: 3px solid var(--bad); background: var(--sunk); border-radius: 0 8px 8px 0; padding: 8px 10px; font-size: 13px; }
.grv b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--bad); }
.grv.hold { border-left-color: var(--warn); } .grv.hold b { color: var(--warn); }
.tag.bad { border-color: var(--bad); color: var(--bad); }
.tag.hold { border-color: var(--warn); color: var(--warn); }
.tag.pledged { background: var(--good); border-color: var(--good); color: var(--surface); }
.todo li.bad { border-color: var(--bad); }
/* council seats */
.seats { display: flex; flex-wrap: wrap; gap: 4px; padding-top: 4px; border-top: 1px dashed var(--line); }
.seat { position: relative; display: flex; flex-direction: column; align-items: center; width: 42px; gap: 1px; }
.seat .portrait { width: 32px; height: 32px; }
.seat.no .portrait { opacity: .55; }
.seat .you { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.seat .vm { position: absolute; top: 20px; left: 26px; width: 15px; height: 15px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1.5px solid var(--surface); }
.seat.yes .vm { background: var(--good); } .seat.no .vm { background: var(--bad); }
.seat .vm svg { width: 9px; height: 9px; }
.seat .rw { position: absolute; top: -3px; left: -1px; min-width: 15px; height: 15px; padding: 0 2px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 700; }
.seat .rw svg { width: 10px; height: 10px; }
.seat small { font-size: 10px; color: var(--muted); }
.tally { font-size: 12.5px; font-weight: 600; }
.opt .fx li { display: flex; gap: 5px; align-items: center; }
.dlg .who-row { display: flex; gap: 12px; align-items: center; }
.dlg .who-row .portrait { width: 56px; height: 56px; }
/* act title card */
.actcard { text-align: center; align-items: center; }
.actcard .actno { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--accent); letter-spacing: .12em; text-transform: uppercase; }
.actcard h2 { font-size: 34px; }
.pictos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; }
.picto { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; border-radius: 9px; background: var(--sunk); font-size: 12.5px; line-height: 1.3; }
.picto svg { width: 64px; height: 44px; }
.picto b { font-size: 13px; }
@media (max-width: 480px) { .pictos { grid-template-columns: 1fr; } .picto { flex-direction: row; text-align: left; } }
@media (prefers-reduced-motion: no-preference) {
  .actcard { animation: cardin .5s ease-out; }
}
@keyframes cardin { from { transform: translateY(12px) scale(.97); opacity: 0; } }
.endseals { display: flex; gap: 12px; flex-wrap: wrap; }
.endseals span { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); }
.endseals svg { width: 34px; height: 34px; }

/* trust sparklines on the power chips */
.spk { display: flex; align-items: center; gap: 5px; }
.spk svg { flex: none; overflow: visible; }
.spk .ln { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.spk .th { stroke: currentColor; stroke-width: 1; stroke-dasharray: 2 2; opacity: .45; }
.spk .end { fill: currentColor; }
.spk .end.ok { fill: var(--good); stroke: var(--surface); stroke-width: 1; }
.spk { gap: 3px; }
.spk b { font-family: var(--font-display); font-size: 12.5px; line-height: 1; min-width: 2ch; }
.pc.member .spk .end.ok { stroke: var(--accent); }
.pc.member .spk { color: var(--accent-ink); }
@media (prefers-reduced-motion: no-preference) {
  .pc.flip { animation: flip .55s cubic-bezier(.3, 1.4, .5, 1); }
}
@keyframes flip { 0% { transform: perspective(300px) rotateX(85deg); } 100% { transform: perspective(300px) rotateX(0); } }

/* the signing moment: drawn in #fx, removes itself */
.map .stamp .rim { fill: var(--accent); stroke: var(--accent-ink); stroke-width: 1.4; }
.map .stamp .face { fill: none; stroke: var(--accent-ink); stroke-width: 1.2; opacity: .55; }
.map .stamp .tick { fill: none; stroke: var(--accent-ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.map .stamp.pledge .rim { fill: var(--good); stroke: var(--surface); }
.map .stamp.pledge .face, .map .stamp.pledge .tick { stroke: var(--surface); }
.map .glowfx { fill: var(--accent); }
.map .glowfx.pledge { fill: var(--good); }
.map .node.signing .base { fill: var(--surface); }
.map .node.signing .ring { stroke: var(--muted); }
.map .node.signing text.t { fill: var(--ink); }
.map .pseal.signing { opacity: 0; }

/* dispute scene: two leaders across a table */
.scene { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; gap: 4px; padding: 6px 0 2px; }
.scene .side { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.scene .side .portrait { width: 84px; height: 84px; }
.scene .side.a .portrait { transform: rotate(5deg); }
.scene .side.b .portrait { transform: rotate(-5deg); }

/* council chamber: seats in a half circle, the proposer at the lectern */

}

/* phones: give the map every pixel, and set its words larger than the frame's own scale would */
@media (max-width: 480px) {
  .wrap { padding: 8px; gap: 8px; }

.relnet .rl2.pos .ln { stroke: var(--good); }

.relnet .rn circle { stroke: var(--surface); stroke-width: 2; }
.relnet .rn.member circle { stroke: var(--accent); stroke-width: 3; }
.relnet .rn text { font-family: var(--font-body); font-size: 11px; font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.relnet .rn-home { fill: var(--accent); stroke: var(--accent-ink); stroke-width: 1.5; }
.row.flash { box-shadow: 0 0 0 2px var(--river); }
.row > span:first-child { display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.star .tie { cursor: pointer; }
/* the chamber: sixteen seats in two rows */
.chamber { max-width: 560px; aspect-ratio: 2 / 1.08; }
.chamber .floor .bench.in { stroke-width: 7; }
.chamber .seat { width: 40px; }
.chamber .seat .portrait, .chamber .seat .you, .chamber .seat .empty, .chamber .seat .ring { width: 34px; height: 34px; }

.noes { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12.5px; justify-content: center; margin-top: 4px; }

/* the campaign chart: one power forward at a time */
.hchart .pl .tl { stroke: var(--muted); stroke-width: 1.2; opacity: .45; }

.hchart .pl.on .tl { stroke: var(--c); stroke-width: 2.4; opacity: 1; }
.hchart .pl.on .tl.mem { stroke-width: 4.2; }
.hnames { display: flex; flex-wrap: wrap; gap: 3px; }
.hp { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 1px 8px 1px 5px; border-radius: 10px; border: 1px solid var(--line); background: var(--sunk); color: var(--muted); }
.hp.m { color: var(--ink); font-weight: 600; }

.endseals { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px 6px; }
.endseals span { text-align: center; }
.endseals svg { width: 28px; height: 28px; }

<script>

  var prefs = { seenHelp: false, adviser: true, details: !!(window.matchMedia && window.matchMedia('(hover: none)').matches) };
  try { var p = JSON.parse(localStorage.getItem('aman-prefs') || '{}'); if (typeof p.adviser === 'boolean') prefs.adviser = p.adviser; if (typeof p.details === 'boolean') prefs.details = p.details; if (p.seenHelp === true) prefs.seenHelp = true; } catch (e) {}

  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-do]');
    if (!el || el.disabled || el.tagName === 'INPUT') return;
    if (el.classList.contains('veil') && e.target !== el) return;
    handle(el);
  });
  document.addEventListener('change', function (e) { if (e.target.matches && e.target.matches('input[data-do="pref"]')) handle(e.target); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modal) { handle(document.querySelector('.dlg [data-do="closemodal"]')); return; } if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('g[data-do]')) { e.preventDefault(); handle(e.target); } });
  function showDetail(e) {
    var box = document.getElementById('detail'), tip = e.target.closest && e.target.closest('[data-tip]');
    if (tip && box) { hover = { tip: tip.getAttribute('data-tip') }; box.innerHTML = detailHtml(); return; }
    var el = e.target.closest && e.target.closest('.act');
    if (!el || !box || !el.closest('.acts')) return;
    hover = { name: el.getAttribute('data-name'), hint: el.getAttribute('data-hint'), why: el.getAttribute('data-why'), cost: el.getAttribute('data-cost') };
    box.innerHTML = detailHtml();
  }
  document.addEventListener('mouseover', showDetail);
  document.addEventListener('focusin', showDetail);

  /* ---------- attention pins: the sentence shows beside the pin on hover, focus, or tap ---------- */
  var tipFor = null, touchDown = false, tipWasOpen = false;
  function showTip(anchor, items, key) {
    var tip = document.getElementById('tip'), wrap = anchor && anchor.closest('.mapwrap');
    if (!tip || !wrap || !items.length) return;
    var f = items[0].f;
    tip.innerHTML = items.map(function (x) { return '<p class="' + x.tone + '">' + kindIcon(x.k) + '<span>' + esc(x.text) + '</span></p>'; }).join('') +
      (f ? '<button class="ghost" data-do="sel" data-f="' + f + '" tabindex="-1">Open ' + esc(A.FACTIONS[f].name) + '</button>' : '');
    tip.hidden = false;
    var w = wrap.getBoundingClientRect(), r = anchor.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    var x = r.left + r.width / 2 - w.left - tw / 2, y = r.top - w.top - th - 8;
    if (y < 4) y = r.bottom - w.top + 8;
    tip.style.left = Math.max(4, Math.min(w.width - tw - 4, x)) + 'px';
    tip.style.top = Math.max(4, Math.min(w.height - th - 4, y)) + 'px';
    tipFor = key;
  }
  function hideTip() { var tip = document.getElementById('tip'); if (tip) tip.hidden = true; tipFor = null; }
  function pinItems(el) {
    var p = el.closest && el.closest('[data-att]');
    if (p) return { anchor: p, key: 'a' + p.getAttribute('data-att'), items: [ATT[+p.getAttribute('data-att')]].filter(Boolean) };
    var n = el.closest && el.closest('.node.needs');
    if (n) { var id = n.getAttribute('data-f'); return { anchor: n.querySelector('.base'), key: 'f' + id, items: ATT.filter(function (x) { return x.f === id && !x.done; }) }; }
    return null;
  }
  document.addEventListener('mouseover', function (e) {
    if (touchDown) return;
    if (e.target.closest && e.target.closest('#tip')) return;
    var p = e.target.closest && e.target.closest('[data-att]');
    if (p) { var it = pinItems(p); showTip(it.anchor, it.items, it.key); }
    else if (tipFor) hideTip();
  });
  document.addEventListener('keydown', function () { touchDown = false; }, true);
  document.addEventListener('focusin', function (e) {
    // a tap focuses the node too; the tap's own click shows the tip, so focus must not show one under the finger
    if (touchDown) return;
    var it = e.target.matches && (e.target.matches('.node.needs') || e.target.matches('[data-att]')) ? pinItems(e.target) : null;
    if (it) showTip(it.anchor, it.items, it.key); else if (tipFor && !(e.target.closest && e.target.closest('#tip'))) hideTip();
  });
  // On a touch screen the first tap on a pin, or on a power that needs you, shows its sentences.
  // A second tap, or the Open button in the tip, opens the dossier.
  document.addEventListener('pointerdown', function (e) {
    touchDown = e.pointerType === 'touch';
    var it = touchDown ? pinItems(e.target) : null;
    tipWasOpen = !!(it && tipFor && (tipFor === it.key || tipFor === 'f' + (it.items[0] && it.items[0].f)));
  }, true);
  document.addEventListener('click', function (e) {
    if (!touchDown) return;
    var it = pinItems(e.target);
    if (it && it.items.length && !tipWasOpen) { e.stopPropagation(); e.preventDefault(); showTip(it.anchor, it.items, it.key); return; }
    if (!it && !(e.target.closest && e.target.closest('#tip, .achip'))) hideTip();
  }, true);

  /* Chips light the matching pins on the map: on hover or focus, and on tap or click until tapped again. */
  var hlLock = null;
  function lightPins(k) {
    var svg = document.querySelector('.map svg');
    if (!svg) return;
    svg.classList.toggle('hl', !!k);
    Array.prototype.forEach.call(svg.querySelectorAll('.pin'), function (p) { p.classList.toggle('lit', !!k && p.getAttribute('data-k') === k); });
    Array.prototype.forEach.call(svg.querySelectorAll('.node'), function (n) { n.classList.toggle('lit', !!k && !!n.querySelector('.pin[data-k="' + k + '"]')); });
    var home = svg.querySelector('.home'); if (home) home.classList.toggle('lit', !!k && !!home.querySelector('.pin[data-k="' + k + '"]'));
    Array.prototype.forEach.call(document.querySelectorAll('.achip'), function (c) { c.setAttribute('aria-pressed', String(hlLock === c.getAttribute('data-hl'))); });
  }
  document.addEventListener('mouseover', function (e) {
    var c = e.target.closest && e.target.closest('.achip');
    if (c && !touchDown) lightPins(c.getAttribute('data-hl'));
    else if (!c && e.target.closest && !e.target.closest('.achips')) lightPins(hlLock);
  });
  document.addEventListener('focusin', function (e) { var c = e.target.closest && e.target.closest('.achip'); if (c) lightPins(c.getAttribute('data-hl')); });
  document.addEventListener('focusout', function (e) { if (e.target.closest && e.target.closest('.achip')) lightPins(hlLock); });
  document.addEventListener('click', function (e) {
    var c = e.target.closest && e.target.closest('.achip');
    if (!c) return;
    var k = c.getAttribute('data-hl');
    hlLock = hlLock === k ? null : k;
    lightPins(hlLock);
    var m = document.querySelector('.map svg');
    if (hlLock && m && m.getBoundingClientRect().bottom < 60) m.scrollIntoView({ block: 'start', behavior: REDUCE ? 'auto' : 'smooth' });
  });
  document.addEventListener('toggle', function (e) { if (e.target.classList && e.target.classList.contains('attlist')) attOpen = e.target.open; }, true);

  /* A suggestion row and its arrow on the map light each other, and the row's reason shows below the list. */
  function lightSug(id) {
    Array.prototype.forEach.call(document.querySelectorAll('.map .sugg'), function (g) { g.classList.toggle('lit', g.getAttribute('data-id') === id); });
    var row = id && document.querySelector('.sug[data-sug="' + id + '"]'), box = document.getElementById('sugwhy');
    Array.prototype.forEach.call(document.querySelectorAll('.sug'), function (r) { r.classList.toggle('lit', r === row); });
    if (box) box.textContent = row ? row.getAttribute('data-sugwhy') : 'Point at a suggestion to see why.';
  }
  function sugTarget(e) { var r = e.target.closest && e.target.closest('.sug, .map .sugg'); return r ? r.getAttribute('data-sug') || r.getAttribute('data-id') : null; }
  document.addEventListener('mouseover', function (e) { lightSug(sugTarget(e)); });
  /* A season line or a power chip under the pointer lights its powers on the map. */
  function lightPowers(ids) {
    var svg = document.querySelector('.map svg');
    if (!svg || hlLock) return;
    svg.classList.toggle('hl', !!ids.length);
    Array.prototype.forEach.call(svg.querySelectorAll('.node'), function (n) { n.classList.toggle('lit', ids.indexOf(n.getAttribute('data-f')) >= 0); });
  }
  var litBy = null;
  function powersOver(e) {
    var r = e.target.closest && e.target.closest('[data-fs], .pc, .wc');
    if (r === litBy) return;
    litBy = r;
    if (!r) { lightPowers([]); return; }
    lightPowers(r.hasAttribute('data-fs') ? r.getAttribute('data-fs').split(' ').filter(Boolean) : [r.getAttribute('data-f')]);
  }
  document.addEventListener('mouseover', powersOver);
  document.addEventListener('focusin', powersOver);
  document.addEventListener('focusin', function (e) { lightSug(sugTarget(e)); });

  /* In the council, the option under the pointer or focus previews its vote in the chamber. */
  function councilHover(e) {
    var o = e.target.closest && e.target.closest('.dlg.council .opt[data-c]');
    if (o && CH) previewVote(o.getAttribute('data-c'));
  }
  document.addEventListener('mouseover', councilHover);
  document.addEventListener('focusin', councilHover);
  /* On the campaign chart, a marker, a line, or a name under the pointer, focus, or tap reads out below
     the chart, and brings that power's line forward. A click on a name holds it until clicked again. */
  var chartLock = null;
  function chartFocus(id) {
    var svg = document.querySelector('.hchart');
    if (!svg) return;
    svg.classList.toggle('focus', !!id);
    Array.prototype.forEach.call(svg.querySelectorAll('.pl, .pm'), function (g) {
      var on = g.getAttribute('data-pw') === id;
      g.classList.toggle('on', on);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.hp'), function (b) { b.setAttribute('aria-pressed', String(chartLock === b.getAttribute('data-pw'))); });
  }
  function chartRead(e) {
    var t = e.target.closest && e.target, box = document.getElementById('hread');
    if (!t || !box) return;
    var m = t.closest('.hchart .hm'), pl = t.closest('.hchart .pl, .hchart .pm'), hp = t.closest('.hp');
    if (hp && e.type === 'click') chartLock = chartLock === hp.getAttribute('data-pw') ? null : hp.getAttribute('data-pw');
    var id = hp ? hp.getAttribute('data-pw') : pl ? pl.getAttribute('data-pw') : null;
    if (m) box.textContent = m.getAttribute('data-ht');
    else if (id) box.textContent = document.querySelector('.hchart .pl[data-pw="' + id + '"]').getAttribute('data-ht');
    if (id || t.closest('.hchart, .hnames')) chartFocus(id || chartLock);
    else if (document.querySelector('.hchart.focus') && !chartLock) chartFocus(null);
  }
  document.addEventListener('mouseover', chartRead);
  document.addEventListener('focusin', chartRead);
  document.addEventListener('click', chartRead);
  newGame();
})();
</script>
</body>
